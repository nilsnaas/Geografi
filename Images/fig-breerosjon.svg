<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="420" fill="#f8fafc"/>
  <!-- Left: Rundsva -->
  <rect x="20" y="20" width="370" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#0f172a">Rundsva (støtside vs. leside)</text>
  <path d="M55 290 C80 180, 210 155, 285 185 L290 225 L315 240 L310 275 L335 290 Z" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
  <!-- Ice flow arrow -->
  <path d="M70 115 L310 115" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <polygon points="310,104 335,115 310,126" fill="#0284c7"/>
  <text x="200" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#0369a1">Isbevegelse →</text>
  <!-- Scratches -->
  <line x1="115" y1="205" x2="175" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="222" x2="195" y2="198" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="110" y="325" font-size="12" font-weight="700" fill="#0f172a">Støtside: Skuring</text>
  <text x="110" y="342" font-size="11" fill="#475569">(mykt avrundet + striper)</text>
  <text x="260" y="325" font-size="12" font-weight="700" fill="#0f172a">Leside: Plukking</text>
  <text x="260" y="342" font-size="11" fill="#475569">(kuttet tvert av)</text>

  <!-- Right: V-dal til U-dal -->
  <rect x="410" y="20" width="370" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="430" y="52" font-size="16" font-weight="700" fill="#0f172a">Fra V-dal (elv) til U-dal (isbre)</text>
  <!-- V-dal -->
  <path d="M435 100 L485 155 L535 100 L535 210 L435 210 Z" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="485" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">1. V-dal før istid</text>
  <!-- Under istid -->
  <path d="M555 100 C575 170, 625 170, 645 100 L645 210 L555 210 Z" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <path d="M557 100 C577 168, 623 168, 643 100 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <text x="600" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#0369a1">2. Isbre fyller dalen</text>
  <!-- U-dal -->
  <path d="M665 100 C675 185, 745 185, 755 100 L755 210 L665 210 Z" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="710" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">3. U-dal etter istid</text>
  <!-- Info box -->
  <rect x="435" y="260" width="320" height="110" rx="10" fill="#f1f5f9"/>
  <text x="452" y="288" font-size="12" font-weight="700" fill="#0f172a">Når U-dalen blir til en fjord:</text>
  <text x="452" y="312" font-size="12" fill="#334155">Der isbreen har gravd seg så dypt at havet</text>
  <text x="452" y="330" font-size="12" fill="#334155">trenger inn etter avsmeltingen, får vi en fjord</text>
  <text x="452" y="348" font-size="12" fill="#334155">(f.eks. Sognefjorden, 1300 m dyp).</text>
</svg>
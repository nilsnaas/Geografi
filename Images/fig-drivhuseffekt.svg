<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#facc15"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="820" height="420" rx="16" fill="url(#skyGrad)"/>
  <text x="24" y="34" fill="#f8fafc" font-size="18" font-weight="700">Energibalansen og drivhuseffekten</text>
  <text x="24" y="54" fill="#cbd5e1" font-size="12">Uten drivhuseffekten ville jordas snittemperatur vært −18 °C i stedet for +15 °C</text>

  <!-- Atmosfærelag -->
  <rect x="0" y="135" width="820" height="2" fill="rgba(255,255,255,0.35)" stroke-dasharray="6 6"/>
  <text x="640" y="126" fill="#e2e8f0" font-size="11" font-weight="600">Atmosfærens grense</text>

  <!-- Sol -->
  <circle cx="95" cy="95" r="34" fill="#facc15"/>
  <circle cx="95" cy="95" r="44" fill="rgba(250,204,21,0.22)"/>
  <text x="95" y="100" text-anchor="middle" fill="#713f12" font-size="12" font-weight="700">SOL</text>

  <!-- Bakke: Snø/is til venstre, hav/vegetasjon i midten og til høyre -->
  <path d="M0,335 L190,335 L250,355 L0,355 Z" fill="#f1f5f9"/>
  <path d="M0,335 L110,285 L190,335 Z" fill="#e2e8f0"/>
  <path d="M110,285 L138,308 L112,302 L92,312 Z" fill="#ffffff"/>
  <rect x="0" y="355" width="820" height="65" fill="#14532d"/>
  <path d="M190,355 L520,355 L520,420 L190,420 Z" fill="#166534"/>
  <path d="M520,355 L820,355 L820,420 L520,420 Z" fill="#0369a1"/>
  <text x="85" y="378" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Lys flate (snø/is)</text>
  <text x="355" y="382" text-anchor="middle" fill="#dcfce7" font-size="11" font-weight="700">Mørk flate (skog &amp; land)</text>
  <text x="670" y="382" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">Mørk flate (hav)</text>

  <!-- Solstråle 1: reflekteres av snø -->
  <line x1="115" y1="128" x2="148" y2="305" stroke="#facc15" stroke-width="3.5" marker-end="url(#arrY)"/>
  <line x1="152" y1="305" x2="215" y2="115" stroke="#fde047" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrY)"/>
  <rect x="165" y="158" width="142" height="36" rx="8" fill="rgba(15,23,42,0.8)"/>
  <text x="236" y="174" text-anchor="middle" fill="#fde047" font-size="10.5" font-weight="700">Høy refleksjon (albedo)</text>
  <text x="236" y="187" text-anchor="middle" fill="#e2e8f0" font-size="10">Snø/is sender stråling ut</text>

  <!-- Solstråle 2: absorberes av land/hav -->
  <line x1="132" y1="118" x2="365" y2="346" stroke="#facc15" stroke-width="4" marker-end="url(#arrY)"/>
  <rect x="255" y="258" width="145" height="36" rx="8" fill="rgba(15,23,42,0.8)"/>
  <text x="327" y="274" text-anchor="middle" fill="#fef08a" font-size="10.5" font-weight="700">Absorpsjon av sollys</text>
  <text x="327" y="287" text-anchor="middle" fill="#e2e8f0" font-size="10">Jordoverflata varmes opp</text>

  <!-- Klimagasser i atmosfæren -->
  <g transform="translate(515, 195)">
    <ellipse cx="0" cy="0" rx="115" ry="34" fill="rgba(255,255,255,0.16)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Klimagasser i atmosfæren</text>
    <text x="0" y="12" text-anchor="middle" fill="#bae6fd" font-size="10.5">H₂O · CO₂ · CH₄</text>
  </g>

  <!-- Varmestråling opp, delvis ut, delvis tilbake -->
  <line x1="470" y1="352" x2="495" y2="235" stroke="#f97316" stroke-width="3.5" marker-end="url(#arrR)"/>
  <line x1="540" y1="160" x2="565" y2="82" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="565" y1="230" x2="625" y2="345" stroke="#f97316" stroke-width="3.5" marker-end="url(#arrR)"/>

  <rect x="595" y="255" width="195" height="48" rx="8" fill="rgba(15,23,42,0.84)"/>
  <text x="692" y="273" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">Drivhuseffekten</text>
  <text x="692" y="287" text-anchor="middle" fill="#e2e8f0" font-size="10">Varmestråling absorberes og</text>
  <text x="692" y="298" text-anchor="middle" fill="#e2e8f0" font-size="10">sendes tilbake mot jorda</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="420" fill="#f8fafc"/>
  <!-- Left: Frostforvitring -->
  <rect x="20" y="20" width="370" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#0f172a">Mekanisk: Frostforvitring (~10 % utvidelse)</text>
  <!-- Step 1 -->
  <path d="M45 140 L105 90 L145 110 L145 210 L45 210 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <path d="M98 95 L103 145 L85 170 L106 185" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <text x="95" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">1. Vann i sprekk</text>
  <!-- Step 2 -->
  <path d="M165 140 L220 90 L265 110 L265 210 L165 210 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <path d="M215 92 L222 145 L202 175 L225 190" fill="none" stroke="#bae6fd" stroke-width="9" stroke-linecap="round"/>
  <path d="M196 130 L182 126 M240 130 L254 126" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="215" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">2. Fryser &amp; sprenger</text>
  <!-- Step 3 -->
  <path d="M285 140 L330 92 L345 100 L345 210 L285 210 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <path d="M352 108 L376 122 L372 165 L350 155 Z" fill="#64748b" stroke="#334155" stroke-width="2" transform="rotate(18 360 140)"/>
  <text x="330" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">3. Blokk løsner</text>
  <!-- Talus slope -->
  <path d="M45 270 L110 270 L110 350 L365 350 L365 375 L45 375 Z" fill="#64748b"/>
  <path d="M110 315 L230 350 L110 350 Z" fill="#94a3b8"/>
  <circle cx="135" cy="340" r="8" fill="#475569"/><circle cx="155" cy="342" r="7" fill="#475569"/><circle cx="175" cy="345" r="6" fill="#475569"/>
  <text x="205" y="305" font-size="12" fill="#475569">Steinur dannes ved foten av fjellet</text>

  <!-- Right: Kjemisk forvitring / Kalksteinshule -->
  <rect x="410" y="20" width="370" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="430" y="52" font-size="16" font-weight="700" fill="#0f172a">Kjemisk: Surt vann i kalkstein</text>
  <rect x="435" y="120" width="320" height="220" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <!-- Surface green -->
  <path d="M435 120 Q500 115 530 135 Q555 115 620 120 Q645 140 665 120 L755 120 L755 132 L435 132 Z" fill="#22c55e"/>
  <!-- Cave -->
  <path d="M470 250 C480 185, 690 185, 710 250 C725 300, 680 315, 620 315 C560 315, 460 305, 470 250 Z" fill="#451a03"/>
  <!-- Underground river -->
  <path d="M475 280 Q590 275 705 285 L700 308 Q590 305 478 302 Z" fill="#38bdf8"/>
  <!-- Stalactites & stalagmites -->
  <polygon points="520,198 526,232 532,198" fill="#fef3c7"/>
  <polygon points="560,192 567,238 574,192" fill="#fef3c7"/>
  <polygon points="620,195 626,228 632,195" fill="#fef3c7"/>
  <polygon points="558,280 566,248 574,280" fill="#fde68a"/>
  <polygon points="640,282 647,252 654,282" fill="#fde68a"/>
  <text x="530" y="102" font-size="11" font-weight="600" fill="#15803d">Synkehull</text>
  <text x="655" y="102" font-size="11" font-weight="600" fill="#0284c7">Nedløpshull</text>
  <text x="595" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Stalaktitter (tak) &amp; stalagmitter (gulv)</text>
</svg>
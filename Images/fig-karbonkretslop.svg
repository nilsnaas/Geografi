<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrC" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrRedC" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="820" height="380" rx="16" fill="#f5f3ee"/>
  <text x="24" y="34" fill="#0f172a" font-size="18" font-weight="700">Karbonets kretsløp og menneskeskapte utslipp</text>
  <text x="24" y="54" fill="#475569" font-size="12">70 % av CO₂-utslippene kommer fra fossile brensler og 30 % fra avskoging og arealendringer</text>

  <!-- Atmosfæren -->
  <rect x="240" y="74" width="340" height="58" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="410" y="99" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="700">Atmosfæren (CO₂ og CH₄)</text>
  <text x="410" y="117" text-anchor="middle" fill="#334155" font-size="11">Høyeste CO₂-nivå på minst 2 millioner år</text>

  <!-- Skog & Permafrost -->
  <rect x="30" y="190" width="230" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="216" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">Skog, jord &amp; permafrost</text>
  <text x="145" y="236" text-anchor="middle" fill="#334155" font-size="11">Fotosyntesen binder CO₂</text>
  <text x="145" y="254" text-anchor="middle" fill="#334155" font-size="11">Taiga &amp; permafrost lagrer</text>
  <text x="145" y="270" text-anchor="middle" fill="#b91c1c" font-size="10.5" font-weight="600">Avskoging (30 %) frigjør karbon</text>

  <!-- Fossilt lager -->
  <rect x="295" y="210" width="230" height="135" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="410" y="236" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">Fossile lagre i jordskorpa</text>
  <text x="410" y="255" text-anchor="middle" fill="#334155" font-size="11">Kull, olje og naturgass</text>
  <text x="410" y="275" text-anchor="middle" fill="#b91c1c" font-size="11.5" font-weight="700">Forbrenning = 70 % av utslipp</text>
  <text x="410" y="295" text-anchor="middle" fill="#475569" font-size="10.5">Industri, kraft, olje/gass &amp; transport</text>
  <text x="410" y="315" text-anchor="middle" fill="#475569" font-size="10.5">Flytter karbon fra dypet til lufta</text>

  <!-- Havet -->
  <rect x="560" y="190" width="230" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="675" y="216" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Verdenshavene</text>
  <text x="675" y="236" text-anchor="middle" fill="#334155" font-size="11">Har tatt opp ~50 % av utslippene</text>
  <text x="675" y="254" text-anchor="middle" fill="#334155" font-size="11">sammen med planter</text>
  <text x="675" y="272" text-anchor="middle" fill="#1e40af" font-size="10.5" font-weight="600">Varmere hav tar opp mindre CO₂</text>

  <!-- Piler -->
  <path d="M165,186 Q200,145 255,134" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRedC)"/>
  <path d="M240,115 Q165,125 120,185" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="410" y1="208" x2="410" y2="138" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRedC)"/>
  <path d="M582,115 Q655,125 690,185" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrC)"/>
  <path d="M640,186 Q615,148 568,134" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrC)"/>
</svg>

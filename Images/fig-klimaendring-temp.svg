<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Inter, system-ui, sans-serif">
  <rect width="820" height="380" rx="16" fill="#f5f3ee"/>
  <text x="24" y="34" fill="#0f172a" font-size="18" font-weight="700">Global oppvarming: temperaturstigning og årsaker</text>
  <text x="24" y="54" fill="#475569" font-size="12">Oppvarmingen er ujevnt fordelt – Norge og Arktis varmes opp langt raskere enn verdenssnittet</text>

  <!-- Søyler for temperaturøkning -->
  <g transform="translate(28, 82)">
    <rect width="365" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="700">Målt temperaturøkning</text>

    <text x="16" y="62" fill="#334155" font-size="11.5" font-weight="600">Globalt snitt (2024 vs. 1850–1930)</text>
    <rect x="16" y="70" width="90" height="22" rx="6" fill="#f59e0b"/>
    <text x="114" y="85" fill="#b45309" font-size="12" font-weight="700">+1,5 °C</text>

    <text x="16" y="122" fill="#334155" font-size="11.5" font-weight="600">Norge (siden år 1900)</text>
    <rect x="16" y="130" width="155" height="22" rx="6" fill="#ea580c"/>
    <text x="179" y="145" fill="#c2410c" font-size="12" font-weight="700">+2,7 °C</text>

    <text x="16" y="182" fill="#334155" font-size="11.5" font-weight="600">Svalbard årssnitt (siden 1971)</text>
    <rect x="16" y="190" width="245" height="22" rx="6" fill="#dc2626"/>
    <text x="269" y="205" fill="#b91c1c" font-size="12" font-weight="700">nesten +5 °C</text>

    <text x="16" y="236" fill="#334155" font-size="11.5" font-weight="600">Svalbard vinter: nesten +8 °C (6× snittet)</text>
    <rect x="16" y="244" width="320" height="14" rx="5" fill="#991b1b"/>
  </g>

  <!-- Naturlige vs menneskeskapte -->
  <g transform="translate(415, 82)">
    <rect width="377" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="700">Hvorfor endrer klimaet seg?</text>

    <rect x="16" y="42" width="345" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="62" fill="#0369a1" font-size="12" font-weight="700">Naturlige svingninger (langsomme / kortvarige)</text>
    <text x="28" y="80" fill="#334155" font-size="11">• Milanković-sykluser (istider over tusener av år)</text>
    <text x="28" y="96" fill="#334155" font-size="11">• Platedrift (millioner av år) &amp; asteroider</text>
    <text x="28" y="112" fill="#334155" font-size="11">• Vulkanutbrudd (kjøler 1–2 år) &amp; El Niño / La Niña</text>
    <text x="28" y="128" fill="#64748b" font-size="10.5">Forklarer kun en liten del av dagens raske stigning.</text>

    <rect x="16" y="150" width="345" height="104" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="28" y="170" fill="#b91c1c" font-size="12" font-weight="700">Menneskeskapt oppvarming (hovedårsak nå)</text>
    <text x="28" y="188" fill="#334155" font-size="11">• Utslipp av CO₂ (+52 % siden 1750) og CH₄</text>
    <text x="28" y="204" fill="#334155" font-size="11">• Endret arealbruk og avskoging</text>
    <text x="28" y="220" fill="#334155" font-size="11">• Forsterker drivhuseffekten opptil 20× raskere</text>
    <text x="28" y="236" fill="#b91c1c" font-size="10.5" font-weight="600">  enn oppvarmingen etter siste istid.</text>
  </g>
</svg>

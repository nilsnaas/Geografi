<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="420" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="54" font-size="18" font-weight="700" fill="#0f172a">Kvikkleireskred: Fra saltbundet marin leire til leiresuppe</text>

  <!-- 4 stages top -->
  <rect x="45" y="75" width="165" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="127" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">1. Salt porevann</text>
  <text x="127" y="128" font-size="11" text-anchor="middle" fill="#334155">Åpen korthusstruktur.</text>
  <text x="127" y="146" font-size="11" text-anchor="middle" fill="#15803d" font-weight="600">Saltet binder flakene.</text>

  <rect x="225" y="75" width="165" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="307" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">2. Kvikkleire før ras</text>
  <text x="307" y="128" font-size="11" text-anchor="middle" fill="#78350f">Ferskvann vasker ut</text>
  <text x="307" y="146" font-size="11" text-anchor="middle" fill="#b45309" font-weight="600">saltet → ustabil leire.</text>

  <rect x="405" y="75" width="165" height="120" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="487" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">3. Under ras</text>
  <text x="487" y="128" font-size="11" text-anchor="middle" fill="#7f1d1d">Kornstrukturen kollapser</text>
  <text x="487" y="146" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">→ tyntflytende suppe!</text>

  <rect x="585" y="75" width="165" height="120" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="667" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">4. Omrørt leire</text>
  <text x="667" y="128" font-size="11" text-anchor="middle" fill="#334155">Tettere struktur etter ras.</text>
  <text x="667" y="146" font-size="11" text-anchor="middle" fill="#334155" font-weight="600">Blir aldri kvikk igjen.</text>

  <!-- Cross-section bottom -->
  <path d="M45 340 L120 340 L210 250 L750 250 L750 365 L45 365 Z" fill="#94a3b8"/>
  <path d="M120 340 L210 250 L750 250 L750 272 L225 272 L145 340 Z" fill="#fef08a"/>
  <path d="M55 325 L110 325 L100 345 L65 345 Z" fill="#38bdf8"/>
  <text x="82" y="316" font-size="11" font-weight="700" text-anchor="middle" fill="#0369a1">Elveerosjon</text>
  <text x="275" y="238" font-size="12" font-weight="700" fill="#dc2626">Initialras → Hovedras bakover i terrenget</text>
  <text x="650" y="265" font-size="11" font-weight="600" fill="#854d0e">Tørrskorpe</text>
  <text x="650" y="310" font-size="12" font-weight="700" fill="#1e293b">Kvikkleire</text>
</svg>
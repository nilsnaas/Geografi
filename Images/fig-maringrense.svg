<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="54" font-size="18" font-weight="700" fill="#0f172a">Marin grense: Hvorfor både kornjord og kvikkleire finnes her</text>
  <!-- Bedrock & forest above marine limit -->
  <path d="M45 100 L195 100 L280 205 L755 280 L755 330 L45 330 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <!-- Marine clay below marine limit -->
  <path d="M235 160 L540 185 L755 245 L755 280 L280 205 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- Fertile topsoil / grain fields -->
  <path d="M235 160 L540 185 L540 198 L242 172 Z" fill="#eab308"/>
  <!-- Quick clay pocket -->
  <ellipse cx="445" cy="222" rx="85" ry="22" fill="#fca5a5" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- River -->
  <path d="M540 185 L620 212 L600 222 L540 198 Z" fill="#38bdf8"/>
  <!-- Marine limit dashed line -->
  <line x1="45" y1="158" x2="755" y2="158" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="615" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#0284c7">Marin grense (~147 m i Grenland / &gt;200 m ved Oslo)</text>
  <!-- Labels -->
  <text x="120" y="88" font-size="12" font-weight="700" text-anchor="middle" fill="#15803d">Over marin grense</text>
  <text x="120" y="130" font-size="11" text-anchor="middle" fill="#f8fafc">Morene, skog &amp; fjell</text>
  <text x="120" y="145" font-size="11" text-anchor="middle" fill="#f8fafc">(Ikke kvikkleire)</text>

  <text x="385" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#854d0e">1. Landbruk: Næringsrik kornjord</text>
  <text x="445" y="226" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">2. Kvikkleire (salt vasket ut)</text>
  <text x="645" y="295" font-size="12" font-weight="600" text-anchor="middle" fill="#f8fafc">Elveerosjon kan utløse skred</text>
</svg>
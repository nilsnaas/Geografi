<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrFb" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrSun" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#eab308"/>
    </marker>
  </defs>
  <rect width="820" height="360" rx="16" fill="#f5f3ee"/>
  <text x="24" y="34" fill="#0f172a" font-size="18" font-weight="700">Tilbakekobling: Når snø, is og permafrost tiner</text>
  <text x="24" y="54" fill="#475569" font-size="12">Mørkere flater tar opp opptil 90 % av solenergien – og tining frigjør mer metan og CO₂</text>

  <!-- Venstre: Snø/is vs Mørkt hav -->
  <g transform="translate(24, 76)">
    <rect width="376" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="18" y="26" fill="#0f172a" font-size="13" font-weight="700">1. Albedo-effekten i Arktis</text>

    <!-- Snø -->
    <rect x="20" y="165" width="155" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="97" y="192" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Snø og havis</text>
    <text x="97" y="210" text-anchor="middle" fill="#334155" font-size="10.5">Absorberer bare 10–20 %</text>
    <line x1="75" y1="62" x2="95" y2="158" stroke="#eab308" stroke-width="3" marker-end="url(#arrSun)"/>
    <line x1="102" y1="158" x2="142" y2="62" stroke="#eab308" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrSun)"/>
    <text x="95" y="52" text-anchor="middle" fill="#a16207" font-size="10.5" font-weight="700">Reflekteres tilbake</text>

    <!-- Mørkt hav -->
    <rect x="200" y="165" width="155" height="60" rx="8" fill="#0c4a6e"/>
    <text x="277" y="192" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Mørkt hav (isfritt)</text>
    <text x="277" y="210" text-anchor="middle" fill="#bae6fd" font-size="10.5">Absorberer opptil 90 %</text>
    <line x1="255" y1="62" x2="275" y2="158" stroke="#eab308" stroke-width="4" marker-end="url(#arrSun)"/>
    <text x="278" y="52" text-anchor="middle" fill="#b91c1c" font-size="10.5" font-weight="700">Varmes kraftig opp!</text>
  </g>

  <!-- Høyre: Positiv tilbakekoblingssirkel -->
  <g transform="translate(420, 76)">
    <rect width="376" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="18" y="26" fill="#0f172a" font-size="13" font-weight="700">2. Selvforsterkende tilbakekobling</text>

    <rect x="98" y="46" width="180" height="42" rx="8" fill="#fef2f2" stroke="#f87171"/>
    <text x="188" y="71" text-anchor="middle" fill="#991b1b" font-size="11.5" font-weight="700">1. Temperaturen stiger</text>

    <rect x="196" y="120" width="162" height="54" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="277" y="143" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700">2. Havis smelter &amp;</text>
    <text x="277" y="159" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700">permafrost tiner</text>

    <rect x="18" y="120" width="162" height="54" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="99" y="143" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">3. Mer varme tas opp,</text>
    <text x="99" y="159" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">metan &amp; CO₂ slippes ut</text>

    <path d="M278,67 Q325,85 315,115" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrFb)"/>
    <line x1="194" y1="147" x2="184" y2="147" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrFb)"/>
    <path d="M62,115 Q52,85 93,67" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrFb)"/>

    <text x="188" y="216" text-anchor="middle" fill="#334155" font-size="11">Passeres et kritisk <tspan font-weight="700">vippepunkt</tspan>, kan</text>
    <text x="188" y="232" text-anchor="middle" fill="#334155" font-size="11">endringer bli varige (irreversible).</text>
  </g>
</svg>

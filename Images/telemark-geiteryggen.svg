<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="54" font-size="18" font-weight="700" fill="#0f172a">Telemark-eksempel: Geiteryggen i Skien (Isranddelta &amp; grustak)</text>
  <!-- Ice -->
  <path d="M45 95 L210 95 L230 220 L45 220 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#0369a1">Innlandsis</text>
  <text x="125" y="174" font-size="11" text-anchor="middle" fill="#0369a1">(ca. 11 000 år siden)</text>
  <!-- Delta plateau (Geiteryggen) -->
  <polygon points="220,165 520,165 585,295 220,295" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <!-- Gravel pit cut -->
  <path d="M390 165 L415 215 L485 215 L495 165" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Marine clay outside -->
  <polygon points="520,165 755,270 755,295 585,295" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <!-- Old sea level line -->
  <line x1="220" y1="165" x2="755" y2="165" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="645" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#0284c7">Marin grense (~147 moh.)</text>
  <!-- Runway icon -->
  <rect x="255" y="157" width="115" height="8" rx="2" fill="#334155"/>
  <text x="312" y="146" font-size="11" font-weight="700" text-anchor="middle" fill="#1e293b">Geiteryggen flyplass</text>
  <text x="445" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Grustak</text>
  <text x="445" y="211" font-size="10" text-anchor="middle" fill="#92400e">(sand &amp; grus)</text>
  <text x="370" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">Isranddelta avsatt av smeltevannselver</text>
  <text x="665" y="286" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">Marin leire utenfor</text>
</svg>
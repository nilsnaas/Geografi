<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="tmSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrTm" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="820" height="360" rx="16" fill="url(#tmSky)"/>
  <text x="24" y="34" fill="#0f172a" font-size="17" font-weight="700">Telemark som klimaprofil: fra kyst til høyfjell</text>
  <text x="24" y="53" fill="#475569" font-size="12">Høyde over havet og avstand fra kysten gir store klimaforskjeller innenfor ett fylke</text>

  <!-- Hav til venstre -->
  <rect x="0" y="255" width="190" height="105" fill="#0284c7"/>
  <!-- Kyst til innland til fjell -->
  <path d="M180,255 L260,242 L430,226 L560,185 L685,105 L765,158 L820,168 L820,360 L180,360 Z" fill="#15803d"/>
  <!-- Snø på Gaustatoppen / Hardangervidda -->
  <path d="M645,131 L685,105 L725,131 L704,125 L685,136 L667,125 Z" fill="#ffffff"/>

  <!-- Pålandsvind -->
  <path d="M35,215 L195,215" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrTm)"/>
  <text x="115" y="205" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">Pålandsvind (dag)</text>

  <!-- Stedsmarkører -->
  <circle cx="195" cy="252" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
  <text x="195" y="292" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Kragerø / Langesund</text>
  <text x="195" y="308" text-anchor="middle" fill="#e0f2fe" font-size="10">Kystklima · Milde vintre</text>
  <text x="195" y="322" text-anchor="middle" fill="#e0f2fe" font-size="10">0 m o.h.</text>

  <circle cx="385" cy="230" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
  <text x="385" y="292" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Grenland / Midt-Telemark</text>
  <text x="385" y="308" text-anchor="middle" fill="#dcfce7" font-size="10">Varme somre · Korn &amp; frukt</text>
  <text x="385" y="322" text-anchor="middle" fill="#dcfce7" font-size="10">Konvektive sommerbyger</text>

  <circle cx="685" cy="105" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
  <text x="685" y="292" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Gaustatoppen &amp; Vinje</text>
  <text x="685" y="308" text-anchor="middle" fill="#e2e8f0" font-size="10">Kaldt høyfjell / polart preg</text>
  <text x="685" y="322" text-anchor="middle" fill="#e2e8f0" font-size="10">1883 m o.h. (ca. −11 til −18 °C kaldere)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="54" font-size="18" font-weight="700" fill="#0f172a">Telemark-eksempel: Jettegrytene i Nissedal (Fyresåna)</text>
  <!-- Granite bedrock -->
  <path d="M45 140 Q140 130 220 145 L230 250 Q255 270 280 250 L290 145 Q380 135 450 145 L465 275 Q495 295 525 275 L540 145 Q640 135 755 150 L755 325 L45 325 Z" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  <!-- Water inside potholes -->
  <path d="M225 185 L285 185 L280 250 Q255 270 230 250 Z" fill="#38bdf8"/>
  <path d="M458 180 L532 180 L525 275 Q495 295 465 275 Z" fill="#0ea5e9"/>
  <!-- Rotating stones -->
  <circle cx="255" cy="242" r="9" fill="#334155"/>
  <circle cx="495" cy="265" r="11" fill="#1e293b"/>
  <path d="M480 220 A18 18 0 1 1 510 220" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Labels -->
  <text x="130" y="122" font-size="12" font-weight="600" fill="#334155">Glattskurt svaberg</text>
  <text x="255" y="118" font-size="12" font-weight="700" text-anchor="middle" fill="#0369a1">Jettegryte</text>
  <text x="495" y="118" font-size="12" font-weight="700" text-anchor="middle" fill="#0369a1">Roterende stein i virvel</text>
  <rect x="570" y="175" width="165" height="120" rx="10" fill="#f1f5f9"/>
  <text x="585" y="200" font-size="12" font-weight="700" fill="#0f172a">Nissedal (Telemark):</text>
  <text x="585" y="220" font-size="11" fill="#334155">• Ca. 300 m langt parti</text>
  <text x="585" y="238" font-size="11" fill="#334155">• Dannet av smeltevann</text>
  <text x="585" y="256" font-size="11" fill="#334155">• Avdekket da Fyresåna</text>
  <text x="585" y="272" font-size="11" fill="#334155">  ble regulert på 1950-tallet</text>
</svg>
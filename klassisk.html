    const CHAPTER_GROUPS = [

      { id: 'elver', title: '3.2 Elvelandformer', dot: 'bg-amber-400', nodeIds: ['n5', 'n6', 'n7'] },

      { id: 'skred', title: '3.5 Skred og ras', dot: 'bg-rose-400', nodeIds: ['n13', 'n14'] }
    ];

    const expandedGroups = new Set(CHAPTER_GROUPS.map(gr => gr.id));
    let activeSectionId = 'n1';

    function renderClassicNav(targetId, closeDrawerOnClick = false) {
      const el = document.getElementById(targetId);
      if (!el) return;
      const groupsHtml = CHAPTER_GROUPS.map(group => {
        const isOpen = expandedGroups.has(group.id);
        const subLinks = group.nodeIds.map(nid => {
          const n = NODES.find(x => x.id === nid);
          if (!n) return '';
          const active = activeSectionId === n.id;
          return `<a href="#${n.id}" data-target="${n.id}" class="nav-link block px-2.5 py-1.5 rounded-lg text-xs text-stone-600 hover:text-stone-900 transition-colors ${active ? 'active-nav bg-nordic-50 text-nordic-800 font-semibold' : ''}">${n.title}</a>`;
        }).join('');
        return `
          <div class="border border-stone-200 rounded-xl overflow-hidden bg-stone-50/50">
            <button type="button" data-group="${group.id}" class="classic-group-btn w-full px-3 py-2 flex items-center justify-between gap-2 text-left text-xs font-bold text-stone-800 hover:bg-stone-100/70 transition-colors">
              <span class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full ${group.dot} shrink-0"></span>
                <span class="truncate">${group.title}</span>
              </span>
              <span class="text-stone-400 shrink-0">${isOpen ? '▾' : '▸'}</span>
            </button>
            <div class="${isOpen ? 'block' : 'hidden'} px-2 pb-2 pt-0.5 space-y-0.5">
              ${subLinks}
            </div>
          </div>
        `;
      }).join('');

      const glossaryLink = `<a href="#ordliste" data-target="ordliste" class="nav-link block px-3 py-2 rounded-lg text-xs font-semibold text-stone-700 hover:text-stone-900 border border-stone-200 transition-colors ${activeSectionId === 'ordliste' ? 'active-nav bg-nordic-50 text-nordic-800' : ''}">📖 Samlet ordliste</a>`;

      el.innerHTML = groupsHtml + glossaryLink;

      el.querySelectorAll('.classic-group-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const gid = btn.dataset.group;
          if (expandedGroups.has(gid)) expandedGroups.delete(gid);
          else expandedGroups.add(gid);
          renderClassicNav('desktop-nav-list', false);
          renderClassicNav('mobile-nav-list', true);
        });
      });

      if (closeDrawerOnClick) {
        el.querySelectorAll('a.nav-link').forEach(a => {
          a.addEventListener('click', () => document.getElementById('mobile-drawer').classList.add('hidden'));
        });
      }
    }

    function renderClassicContent() {

      const introHeader = `

          <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-nordic-700 mb-3">
            <span class="bg-nordic-50 border border-nordic-200/70 px-2.5 py-1 rounded-md">Naturgeografi</span>
            <span class="text-stone-400">/</span>
            <span>Kapittel 3 · Komplett klassisk visning</span>

            <strong>Lisens:</strong> Alle fotografiske illustrasjoner og geologiske figurer i <code>Images/</code> er egenproduserte for dette undervisningsopplegget under åpen lisens (CC0 1.0 / CC BY 4.0).

        </section>
      `;

      main.innerHTML = introHeader + topicSections + glossarySection;

    renderClassicContent();

    // Mobile drawer controls
    const drawer = document.getElementById('mobile-drawer');
    document.getElementById('mobile-menu-btn').addEventListener('click', () => drawer.classList.remove('hidden'));
    document.getElementById('mobile-drawer-close').addEventListener('click', () => drawer.classList.add('hidden'));
    document.getElementById('mobile-drawer-backdrop').addEventListener('click', () => drawer.classList.add('hidden'));

    // Reading progress & Scroll-Spy
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)) : 0;
      document.getElementById('reading-progress').style.width = `${pct}%`;

      const sections = document.querySelectorAll('main section[id]');
      let current = 'n1';
      sections.forEach(sec => {
        if (sec.getBoundingClientRect().top <= 160) current = sec.id;
      });
      if (current !== activeSectionId) {
        activeSectionId = current;
        const ownerGroup = CHAPTER_GROUPS.find(gr => gr.nodeIds.includes(current));
        if (ownerGroup) expandedGroups.add(ownerGroup.id);
        renderClassicNav('desktop-nav-list', false);
        renderClassicNav('mobile-nav-list', true);
      }
    });

    // Tooltip logic
    const tooltip = document.getElementById('glossary-tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipBody = document.getElementById('tooltip-body');
    let hideTimeout = null;
    function showTooltip(trigger) {
      const entry = GLOSSARY[trigger.dataset.term];
      if (!entry) return;
      clearTimeout(hideTimeout);
      tooltipTitle.textContent = entry.title;
      tooltipBody.textContent = entry.definition;
      tooltip.classList.remove('hidden-tooltip');
      tooltip.classList.add('visible-tooltip');
      const rect = trigger.getBoundingClientRect();
      const ttRect = tooltip.getBoundingClientRect();
      let left = Math.max(12, Math.min(rect.left + rect.width / 2 - ttRect.width / 2, window.innerWidth - ttRect.width - 12));
      let top = rect.top - ttRect.height - 10;
      if (top < 12) top = rect.bottom + 10;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTooltip() {
      tooltip.classList.remove('visible-tooltip');
      tooltip.classList.add('hidden-tooltip');
    }
    document.querySelectorAll('.glossary-term').forEach(btn => {
      btn.addEventListener('mouseenter', () => showTooltip(btn));
      btn.addEventListener('mouseleave', () => { hideTimeout = setTimeout(hideTooltip, 150); });
      btn.addEventListener('click', (e) => { e.stopPropagation(); showTooltip(btn); });
    });
    document.getElementById('tooltip-close').addEventListener('click', hideTooltip);
    document.addEventListener('click', (e) => {
      if (!tooltip.contains(e.target) && !e.target.classList.contains('glossary-term')) hideTooltip();
    });

    // Dark / Light theme sync
    const applyClassicTheme = (isDark) => {
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.querySelectorAll('.theme-toggle-icon').forEach(el => {
        el.textContent = isDark ? '☀️' : '🌙';
      });
    };
    const savedClassicTheme = localStorage.getItem('geografi-theme');
    if (savedClassicTheme === 'dark') applyClassicTheme(true);
    document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const isDark = !document.documentElement.classList.contains('dark-theme');
        applyClassicTheme(isDark);
        localStorage.setItem('geografi-theme', isDark ? 'dark' : 'light');
      });
    });
  </script>

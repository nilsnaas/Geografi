  <script>
    const GLOSSARY = {
      'landform': { title: 'Landform', definition: 'Et tydelig trekk i terrenget på jordoverflaten – stort eller lite, i fast berggrunn eller i løse masser – skapt av oppbyggende og nedbrytende naturprosesser.' },
      'indre-krefter': { title: 'Indre krefter', definition: 'Geologiske prosesser som stammer fra jordas indre varme og platebevegelser, og som løfter jordskorpa gjennom fjellkjedefolding, vulkanutbrudd, jordskjelv og landheving.' },
      'ytre-krefter': { title: 'Ytre krefter', definition: 'Prosesser på overflaten drevet av solenergi og tyngdekraft – der vann, is, vind og bølger bryter ned, flytter og legger fra seg stein og jord.' },
      'forvitring': { title: 'Forvitring', definition: 'Nedbryting av fast fjell til mindre biter eller oppløste stoffer uten at materialet flyttes bort fra stedet.' },
      'erosjon': { title: 'Erosjon', definition: 'Samlebetegnelse for at rennende vann, isbreer, vind eller bølger sliter løs materiale fra berggrunnen, frakter det videre og legger det igjen et nytt sted.' },
      'sedimentare-bergarter': { title: 'Sedimentære bergarter', definition: 'Bergarter som oppstår når sand, grus, leire eller kalkavsetninger samles opp lagvis (ofte på havbunnen) og kittes sammen over millioner av år.' },
      'frostforvitring': { title: 'Frostforvitring', definition: 'Fysisk nedbryting av fjell der vann trenger inn i sprekker, fryser til is med nesten 10 % større volum og presser bergblokker fra hverandre.' },
      'trykkavlastning': { title: 'Trykkavlastning', definition: 'Mekanisk oppsprekking i dypbergarter (som granitt) når tyngden fra overliggende berglag slites bort og overflaten utvider seg i flate flak.' },
      'kjemisk-forvitring': { title: 'Kjemisk forvitring', definition: 'Oppløsning eller kjemisk omdanning av mineraler i bergarter, vanligvis når svakt surt regn- eller grunnvann reagerer med berggrunnen.' },
      'slamtransport': { title: 'Slamtransport', definition: 'Frakt av finkornet leire og silt som holdes svevende oppe i vannmassene av strømvirvler, særlig synlig i flomtid.' },
      'bunntransport': { title: 'Bunntransport', definition: 'Frakt av tyngre sand, grus og stein som rulles eller skyves langs bunnen av elveløpet.' },
      'v-dal': { title: 'V-dal', definition: 'En trang dal med V-formet tverrprofil der elva graver seg nedover mens løsmasser jevnlig glir ned fra dalsidene.' },
      'canyon': { title: 'Canyon (elvegjel)', definition: 'En dyp kløft med nær loddrette bergvegger der elva har skåret seg ned i svært motstandsdyktig fjell.' },
      'meanderlop': { title: 'Meanderløp', definition: 'Et buktet elveløp over en flat dalbunn der elva graver i yttersvingene og legger fra seg sand og grus i innersvingene.' },
      'kroksjo': { title: 'Kroksjø', definition: 'En halvmåneformet innsjø som står igjen når en meandrerende elv bryter tvers gjennom en sving under flom og tar et kortere løp.' },
      'elvevifte': { title: 'Elvevifte', definition: 'En vifteformet haug av grus og stein som legges igjen der en bratt sideelv mister fart idet den møter en flatere hoveddal.' },
      'delta': { title: 'Delta', definition: 'En lagdelt avsetning ved utløpet av en elv i sjø eller hav, der grov sand faller ned innerst og fin leire fraktes lengst ut.' },
      'isbre': { title: 'Isbre', definition: 'En sammenhengende masse av snø og is som siger nedover terrenget under sin egen vekt.' },
      'massebalanse': { title: 'Massebalanse', definition: 'Regnskapet mellom hvor mye snø som legger seg på en isbre om vinteren, og hvor mye som smelter bort om sommeren.' },
      'skuring': { title: 'Skuring', definition: 'Sliping av berggrunnen under en isbre ved hjelp av fastfrosne steiner og grus i bresålen, som etterlater skuringsstriper.' },
      'plukking': { title: 'Plukking', definition: 'Prosess der isbreen river løs og frakter med seg oppsprukne steinblokker på lesiden av bergknauser.' },
      'rundsva': { title: 'Rundsva', definition: 'En asymmetrisk bergknaus formet av isbre: glattskurt på siden isen kom fra, og bratt og opprevet på lesiden.' },
      'u-dal': { title: 'U-dal & fjord', definition: 'En breddal med avrundet bunn og bratte sider gravd ut av en isbre; når havet fyller en slik dal etter istiden, kalles den en fjord.' },
      'gamle-landformer': { title: 'Gamle landformer', definition: 'Avrundede og flate landskapstrekk (vidder, heier og skjærgård) som ble slitt ned gjennom eldre jordhistoriske perioder.' },
      'strandflata': { title: 'Strandflata', definition: 'Et lavt, småkupert kystbelte langs Vestlandet og Nord-Norge (fra ca. 50 m under til 50 m over havet) med øyer, holmer og enkelte bratte restfjell.' },
      'raet': { title: 'Raet', definition: 'En lang, sammenhengende morenerygg fra slutten av siste istid (ca. 11 500–12 800 år siden) som markerer hvor innlandsisen gjorde et opphold.' },
      'marin-grense': { title: 'Marin grense', definition: 'Det høyeste nivået havet nådde etter siste istid før landet steg. Under denne grensen finnes marin leire, som både gir god kornjord og risiko for kvikkleire.' },
      'ravine': { title: 'Ravine', definition: 'En dyp, smal bekkedal gravd ut i flate leiravsetninger etter at havbunnen hevet seg til tørt land.' },
      'kvikkleire': { title: 'Kvikkleire', definition: 'Opprinnelig stabil havbunnsleire der saltet mellom leirpartiklene er vasket bort av ferskvann, slik at leira kan bli flytende ved forstyrrelse.' },
      'jordskred': { title: 'Jordskred', definition: 'Utglidning av vannmettet jord og løsmasser i bratte dalsider, ofte utløst av kraftig regn eller rask snøsmelting.' },
      'fjellskred': { title: 'Fjellskred', definition: 'Større ras i fast fjell der mer enn 10 000 kubikkmeter berg løsner; overvåkes kontinuerlig i utsatte fjellpartier.' }
    };

    const g = (term, label) => `<button type="button" class="glossary-term" data-term="${term}">${label}</button>`;

    const NODES = [
      {
        id: 'n1', chapter: 'forvitring', type: 'hovedstamme', icon: '🌍',
        x: 540, y: 745, parents: [],
        period: 'Kapittel 3', part: '1. Grunnlaget',
        title: '1. Hva er en landform? Indre vs. ytre krefter',
        subtitle: 'Samspillet mellom kreftene som bygger opp landet og kreftene som sliter det ned',
        image: 'Images/stryneelva-landformer.jpg',
        caption: 'Stryneelva i Vestland slynger seg over en fruktbar dalbunn formet av rennende vann. · Kilde: Nils',
        enkel: `
          <p>En ${g('landform', 'landform')} er et kjennetegn i terrenget, for eksempel en dal, en fjord eller en sandbanke. Jordoverflaten formes hele tiden av to motstridende krefter: ${g('indre-krefter', 'indre krefter')} som løfter landet opp, og ${g('ytre-krefter', 'ytre krefter')} som tærer det ned.</p>
          <p>Alt materiale som brytes ned på land, fraktes etter hvert ut i havet og synker til bunns, der det over millioner av år kan presses sammen til ${g('sedimentare-bergarter', 'sedimentære bergarter')}.</p>
        `,
        full: `
          <p>Når vi betrakter et norsk landskap, ser vi et puslespill av ulike ${g('landform', 'landformer')} – fra spisse fjelltopper og trange daler til flate sletter og kystøyer. Uttrykket dekker alle naturlige former på landoverflaten, enten de ligger i hardt grunnfjell eller i løs grus og sand.</p>
          <p>Landskapet oppstår i en evig dragkamp mellom to hovedtyper geologiske prosesser. De ${g('indre-krefter', 'indre kreftene')} drives av varme og bevegelser dypt nede i jorda og skaper høydeforskjeller gjennom platekollisjoner, vulkanisme og landheving. For rundt 400 millioner år siden førte en slik kollisjon til den kaledonske fjellkjeden, som kan ha vært opptil 10 000 meter høy i dagens Vest-Norge.</p>
          <p>Uten denne oppbyggingen ville de ${g('ytre-krefter', 'ytre kreftene')} – vind, nedbør, elver, isbreer og havbølger – for lengst ha jevnet ut kontinentene til flate sletter under havnivå. I stedet brytes fjellene gradvis ned til løsmasser som fraktes ut i havet. Der legger sedimentene seg lag på lag og blir over millioner av år omdannet til nye ${g('sedimentare-bergarter', 'sedimentære bergarter')}.</p>
        `,
        caseHtml: `
          <div class="elevated-surface border rounded-xl p-4 space-y-2 text-sm">
            <p class="text-xs font-bold uppercase tracking-wider text-emerald-400">Kompetansemål i kapittel 3</p>
            <p>• Forklare hvordan indre og ytre prosesser former ulike landskap, og gi eksempler på hvordan mennesker bruker naturressursene der.</p>
            <p>• Undersøke årsaker til og følger av en aktuell naturkatastrofe for natur, samfunn og enkeltmennesker.</p>
          </div>
          <p class="text-xs text-sec"><strong>Eksempler fra Norge:</strong> Meandersvingene i Stryneelva (Vestland) og brepåvirket smaragdgrønt vann i Gjende ved Besseggen.</p>
        `,
        quiz: {
          q: 'Hva ville skjedd med jordoverflaten på sikt dersom de indre kreftene sluttet å virke?',
          options: ['Fjellene ville vokst enda høyere', 'De ytre kreftene ville gradvis slitt ned landet til en lav, flat overflate under havnivå', 'Det ville oppstått flere vulkaner', 'Elvene ville sluttet å renne mot havet'],
          correct: 1,
          feedback: 'Riktig! Uten indre krefter som løfter nytt land opp, ville forvitring og erosjon til slutt ha jevnet ut hele jordoverflaten.'
        },
        reflection: 'Se utover nærområdet der du bor: Hvilke trekk i terrenget tror du skyldes indre krefter, og hvilke er laget av vann eller is?',
        goal: 'Kunne forklare hva en landform er, og hvordan indre og ytre krefter virker sammen.'
      },
      {
        id: 'n2', chapter: 'forvitring', type: 'hovedstamme', icon: '❄️',
        x: 250, y: 580, parents: ['n1'],
        period: 'Kapittel 3', part: '2. Mekanisk forvitring',
        title: '2. Mekanisk forvitring: Frost & trykkavlastning',
        subtitle: 'Når fysiske krefter sprenger berggrunnen i mindre stykker på stedet',
        image: 'Images/frostforvitring-fjell.jpg',
        caption: 'Oppsprukket fjellvegg og steinur dannet ved frostsprengning i norsk høyfjell. · Kilde: Nils',
        enkel: `
          <p>${g('forvitring', 'Forvitring')} betyr at fjell brytes ned uten at bitene flyttes bort. Ved <strong>mekanisk forvitring</strong> skjer dette fysisk:</p>
          <p><strong>${g('frostforvitring', 'Frostforvitring')}</strong> oppstår når vann fryser i sprekker og utvider seg med nesten <strong>10 %</strong>. <strong>${g('trykkavlastning', 'Trykkavlastning')}</strong> skjer når fjellaget over en dypbergart som granitt slites vekk, slik at overflaten sprekker opp i flate flak.</p>
        `,
        full: `
          <p>Når fast berggrunn sprekker opp eller smuldrer til grus og sand uten å bli transportert av gårde, kaller vi prosessen ${g('forvitring', 'forvitring')}. Ved <strong>mekanisk forvitring</strong> er det rene fysiske krefter som splitter steinen i mindre biter, uten at selve mineralene endrer kjemi.</p>
          <p><strong>1. ${g('frostforvitring', 'Frostforvitring')}:</strong> Denne prosessen er spesielt kraftig i norske fjellområder der temperaturen ofte pendler over og under frysepunktet. Vann renner ned i små sprekker i berget. Når det fryser til is, øker volumet med omtrent <strong>10 prosent</strong>. Det skaper et voldsomt trykk mot sprekkveggene. Etter mange runder med tining og frysing løsner steinblokker og danner store steinurer ved foten av fjellsidene.</p>
          <p><strong>2. ${g('trykkavlastning', 'Trykkavlastning')}:</strong> Granitt og andre dypbergarter ble dannet flere kilometer nede i jordskorpa under enorm vekt fra berglagene over. Når disse øverste lagene blir slitt bort over millioner av år, forsvinner trykket. Da utvider granitten seg litt og sprekker opp i lag som følger overflaten – omtrent som skallet på en løk. Jevne, tykke flak fra slik avskalling egner seg godt som bygningsstein.</p>
        `,
        caseHtml: `
          <figure class="overflow-hidden rounded-xl border border-slate-500/20 mb-3">
            <img src="Images/trykkavlastning-granitt.jpg" alt="Trykkavlastning i granitt" class="w-full h-44 object-cover" />
            <figcaption class="px-3 py-1.5 text-xs text-sec">Prinsippillustrasjon av avskalling i granitt ved trykkavlastning. · Kilde: Nils</figcaption>
          </figure>
          <figure class="overflow-hidden rounded-xl border border-slate-500/20">
            <img src="Images/fig-forvitring.svg" alt="Skisse av frostforvitring og kjemisk forvitring" class="w-full bg-white p-2" />
            <figcaption class="px-3 py-1.5 text-xs text-sec">Sammenlikning av frostsprengning (venstre) og kjemisk oppløsning (høyre). · Kilde: Nils</figcaption>
          </figure>
        `,

      `).join('');

      const glossarySection = `
        <section id="ordliste" class="scroll-mt-header panel-surface border rounded-2xl p-6 sm:p-9 space-y-6">
          <div class="border-l-4 border-emerald-500 pl-4">
            <span class="text-xs font-semibold uppercase tracking-wider text-emerald-500">Begreper</span>
            <h2 class="font-serif text-2xl sm:text-3xl font-bold mt-1">Samlet ordliste</h2>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            ${Object.values(GLOSSARY).map(item => `
              <div class="elevated-surface border rounded-xl p-4">
                <p class="font-serif font-bold text-base text-emerald-500 mb-1">${item.title}</p>
                <p class="text-sm text-sec leading-relaxed">${item.definition}</p>
              </div>
            `).join('')}
          </div>
        </section>
      `;

      main.innerHTML = introHeader + topicSections + glossarySection;
      bindTooltips();
    }

    const btnToggleAll = document.getElementById('btn-toggle-all-chapters');
    if (btnToggleAll) {
      btnToggleAll.addEventListener('click', () => {
        if (expandedGroups.size === CHAPTER_GROUPS.length) {
          expandedGroups.clear();
          btnToggleAll.textContent = 'Åpne alle';
        } else {
          CHAPTER_GROUPS.forEach(gr => expandedGroups.add(gr.id));
          btnToggleAll.textContent = 'Lukk alle';
        }
        renderClassicNav('desktop-nav-list', false);
        renderClassicNav('mobile-nav-list', true);
      });
    }

    const btnEnkel = document.getElementById('mode-enkel');
    const btnFull = document.getElementById('mode-full');
    function setReadingMode(mode) {
      readingMode = mode;
      btnEnkel.className = mode === 'enkel' ? 'px-2.5 py-1 rounded-md transition-colors bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded-md transition-colors text-sec hover:text-current';
      btnFull.className = mode === 'full' ? 'px-2.5 py-1 rounded-md transition-colors bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded-md transition-colors text-sec hover:text-current';
      renderClassicContent();
    }
    btnEnkel.addEventListener('click', () => setReadingMode('enkel'));
    btnFull.addEventListener('click', () => setReadingMode('full'));

    const drawer = document.getElementById('mobile-drawer');
    document.getElementById('mobile-menu-btn').addEventListener('click', () => drawer.classList.remove('hidden'));
    document.getElementById('mobile-drawer-close').addEventListener('click', () => drawer.classList.add('hidden'));
    document.getElementById('mobile-drawer-backdrop').addEventListener('click', () => drawer.classList.add('hidden'));

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)) : 0;
      document.getElementById('reading-progress').style.width = `${pct}%`;

      const sections = document.querySelectorAll('main section[id]');
      let current = 'startside';
      sections.forEach(sec => {
        if (sec.getBoundingClientRect().top <= 170) current = sec.id;
      });
      if (current !== activeSectionId) {
        activeSectionId = current;
        const ownerGroup = CHAPTER_GROUPS.find(gr => gr.nodeIds.includes(current));
        if (ownerGroup) expandedGroups.add(ownerGroup.id);
        renderClassicNav('desktop-nav-list', false);
        renderClassicNav('mobile-nav-list', true);
      }
    });

    const modalBackdrop = document.getElementById('modal-backdrop');
    document.getElementById('btn-ordliste').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Ordliste · Sentrale fagbegreper';
      document.getElementById('modal-body').innerHTML = `<div class="grid sm:grid-cols-2 gap-3">${Object.values(GLOSSARY).map(item => `
        <div class="elevated-surface border rounded-xl p-4">
          <p class="font-serif font-bold text-base text-emerald-500 mb-1">${item.title}</p>
          <p class="text-xs text-sec leading-relaxed">${item.definition}</p>
        </div>
      `).join('')}</div>`;
      modalBackdrop.classList.remove('hidden');
    });
    document.getElementById('modal-close').addEventListener('click', () => modalBackdrop.classList.add('hidden'));
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.add('hidden'); });
    document.getElementById('btn-print').addEventListener('click', () => window.print());

    const tooltip = document.getElementById('glossary-tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipBody = document.getElementById('tooltip-body');
    let hideTimeout = null;
    function showTooltip(trigger) {
      const entry = GLOSSARY[trigger.dataset.term];
      if (!entry) return;
      clearTimeout(hideTimeout);
      tooltipTitle.textContent = entry.title;
      tooltipBody.textContent = entry.definition;
      tooltip.classList.remove('hidden-tooltip');
      tooltip.classList.add('visible-tooltip');
      const rect = trigger.getBoundingClientRect();
      const ttRect = tooltip.getBoundingClientRect();
      let left = Math.max(12, Math.min(rect.left + rect.width / 2 - ttRect.width / 2, window.innerWidth - ttRect.width - 12));
      let top = rect.top - ttRect.height - 10;
      if (top < 12) top = rect.bottom + 10;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTooltip() {
      tooltip.classList.remove('visible-tooltip');
      tooltip.classList.add('hidden-tooltip');
    }
    function bindTooltips() {
      document.querySelectorAll('.glossary-term').forEach(btn => {
        btn.addEventListener('mouseenter', () => showTooltip(btn));
        btn.addEventListener('mouseleave', () => { hideTimeout = setTimeout(hideTooltip, 150); });
        btn.addEventListener('click', (e) => { e.stopPropagation(); showTooltip(btn); });
      });
    }
    document.getElementById('tooltip-close').addEventListener('click', hideTooltip);
    document.addEventListener('click', (e) => {
      if (!tooltip.contains(e.target) && !e.target.classList.contains('glossary-term')) hideTooltip();
    });

    const applyClassicTheme = (isDark) => {
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    };
    const savedTheme = localStorage.getItem('geografi-theme');
    if (savedTheme === 'dark') applyClassicTheme(true);
    document.getElementById('btn-theme').addEventListener('click', () => {
      const isDark = !document.documentElement.classList.contains('dark-theme');
      applyClassicTheme(isDark);
      localStorage.setItem('geografi-theme', isDark ? 'dark' : 'light');
    });

    renderClassicContent();
    renderClassicNav('desktop-nav-list', false);
    renderClassicNav('mobile-nav-list', true);
  </script>
</body>
</html>
